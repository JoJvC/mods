version: "3.8"
services:
  mods-watch:
    image: alpine/git:latest
    container_name: cobblemon-mods-watch
    restart: unless-stopped
    volumes:
      - mc-mods:/mods
      - mods-repo-cache:/repo
    environment:
      POLL_INTERVAL_SECONDS: "300"
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache git git-lfs
        git lfs install
        LAST_SHA=""
        while true; do
          REMOTE_SHA=$(git ls-remote https://github.com/JoJvC/mods.git refs/heads/cobblemon 2>/dev/null | cut -f1) || REMOTE_SHA=""
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$LAST_SHA" ]; then
            echo "$(date '+%F %T') Novo commit detectado: $REMOTE_SHA - sincronizando mods..."
            if [ -d /repo/.git ]; then
              git -C /repo fetch origin cobblemon
              git -C /repo reset --hard origin/cobblemon
            else
              rm -rf /repo
              git clone --branch cobblemon --single-branch https://github.com/JoJvC/mods.git /repo
            fi
            rm -rf /mods/*
            cp -r /repo/mods/. /mods/
            touch /mods/.synced
            LAST_SHA="$REMOTE_SHA"
            echo "$(date '+%F %T') Mods atualizados: $(ls /mods | wc -l) arquivos. Rode 'docker compose restart minecraft-cobblemon' para aplicar."
          fi
          sleep "$POLL_INTERVAL_SECONDS"
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /mods/.synced"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s

  minecraft-cobblemon:
    image: itzg/minecraft-server:java21
    container_name: minecraft-cobblemon-expanded
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: host
    depends_on:
      mods-watch:
        condition: service_healthy

    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      DIFFICULTY: "normal"
      ENABLE_COMMAND_BLOCK: "true"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      ALLOW_FLIGHT: "false"
      PVP: "true"
      ONLINE_MODE: "false"
      MEMORY: "10G"
      INIT_MEMORY: "2G"
      JVM_XX_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200"
      LOG_TIMESTAMP: "true"
      TZ: "America/Sao_Paulo"
      MOTD: "§4Cobblemon §r- Bem-vindo!"
      MAX_PLAYERS: "20"
      REMOVE_OLD_MODS: "TRUE"

    volumes:
      - mc-cobblemon-data:/data
      - mc-mods:/mods

    ports:
      - "25565:25565"
  cobblemon-backup:
    image: alpine:3.19
    container_name: minecraft-cobblemon-backup-service
    restart: unless-stopped

    environment:
      LEVEL_NAME: "world"
      KEEP_BACKUPS: "7"
      CRON_SCHEDULE: "0 3 * * *"

    volumes:
      - mc-cobblemon-data:/minecraft-data:ro
      - mc-cobblemon-backups:/backups

    command: >
      sh -c "
        apk add --no-cache dcron tar gzip &&
        echo \"$$CRON_SCHEDULE sh -c 'tar -czf /backups/backup_\$$(date +%Y-%m-%d_%H-%M).tar.gz -C /minecraft-data $$LEVEL_NAME && ls -t /backups/*.tar.gz | tail -n +\$$((KEEP_BACKUPS+1)) | xargs rm -f'\" | crontab - &&
        crond -f -l 2
      "
volumes:
  mc-cobblemon-data:
    driver: local
  mc-cobblemon-backups:
    driver: local
  mc-mods:
    driver: local
  mods-repo-cache:
    driver: local
