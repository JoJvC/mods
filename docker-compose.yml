version: "3.8"
services:
  mods-watch:
    image: alpine/git:latest
    container_name: cursed-walking-mods-watch
    restart: unless-stopped
    volumes:
      - mc-mods:/mods
      - mc-cursedwalking-data:/data
      - mods-repo-cache:/repo
    environment:
      POLL_INTERVAL_SECONDS: "300"
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache git git-lfs
        git lfs install
        LAST_SHA=""
        while true; do
          REMOTE_SHA=$(git ls-remote https://github.com/JoJvC/mods.git refs/heads/cursed-walking 2>/dev/null | cut -f1) || REMOTE_SHA=""
          if [ -n "$$REMOTE_SHA" ] && [ "$$REMOTE_SHA" != "$$LAST_SHA" ]; then
            echo "$(date '+%F %T') Novo commit detectado: $$REMOTE_SHA - sincronizando mods e config..."
            if [ -d /repo/.git ]; then
              git -C /repo fetch origin cursed-walking
              git -C /repo reset --hard origin/cursed-walking
            else
              rm -rf /repo/* /repo/.[!.]* 2>/dev/null || true
              git clone --branch cursed-walking --single-branch https://github.com/JoJvC/mods.git /repo
            fi
            rm -rf /mods/*
            cp -r /repo/mods/. /mods/
            touch /mods/.synced
            mkdir -p /data/config /data/kubejs /data/tacz /data/defaultconfigs
            cp -r /repo/config/. /data/config/
            cp -r /repo/kubejs/. /data/kubejs/
            cp -r /repo/tacz/. /data/tacz/
            cp -r /repo/defaultconfigs/. /data/defaultconfigs/
            chown -R 1000:1000 /data/config /data/kubejs /data/tacz /data/defaultconfigs
            LAST_SHA="$$REMOTE_SHA"
            echo "$(date '+%F %T') Mods e config atualizados: $(ls /mods | wc -l) mods. Rode 'docker compose restart minecraft-cursedwalking' para aplicar."
          fi
          sleep "$$POLL_INTERVAL_SECONDS"
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /mods/.synced"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s

  minecraft-cursedwalking:
    image: itzg/minecraft-server:java21
    container_name: minecraft-cursedwalking
    restart: unless-stopped
    stdin_open: true
    tty: true
    network_mode: host
    depends_on:
      mods-watch:
        condition: service_healthy

    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      FORGE_VERSION: "47.4.0"
      DIFFICULTY: "normal"
      ENABLE_COMMAND_BLOCK: "true"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      ALLOW_FLIGHT: "true"
      PVP: "true"
      ONLINE_MODE: "false"
      MEMORY: "8G"
      INIT_MEMORY: "2G"
      JVM_XX_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200"
      LOG_TIMESTAMP: "true"
      TZ: "America/Sao_Paulo"
      MOTD: "§4Cursed Walking §r- Bem-vindo!"
      MAX_PLAYERS: "20"
      REMOVE_OLD_MODS: "TRUE"

    volumes:
      - mc-cursedwalking-data:/data
      - mc-mods:/mods

    ports:
      - "25565:25565"
  cursedwalking-backup:
    image: alpine:3.19
    container_name: minecraft-cursedwalking-backup-service
    restart: unless-stopped

    environment:
      LEVEL_NAME: "world"
      KEEP_BACKUPS: "7"
      CRON_SCHEDULE: "0 3 * * *"

    volumes:
      - mc-cursedwalking-data:/minecraft-data:ro
      - mc-cursedwalking-backups:/backups

    command: >
      sh -c "
        apk add --no-cache dcron tar gzip &&
        echo \"$$CRON_SCHEDULE sh -c 'tar -czf /backups/backup_\$$(date +%Y-%m-%d_%H-%M).tar.gz -C /minecraft-data $$LEVEL_NAME && ls -t /backups/*.tar.gz | tail -n +\$$((KEEP_BACKUPS+1)) | xargs rm -f'\" | crontab - &&
        crond -f -l 2
      "
volumes:
  mc-cursedwalking-data:
    driver: local
  mc-cursedwalking-backups:
    driver: local
  mc-mods:
    driver: local
  mods-repo-cache:
    driver: local
